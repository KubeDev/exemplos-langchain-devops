[project]
name = "agente-onboarding-tool"
version = "0.1.0"
description = "Agente de onboarding com Agentic RAG: a busca como ferramenta, com filtro por metadados montado pelo agente"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-ollama>=1.1.0",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
web = "agente_onboarding_tool.web:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"
