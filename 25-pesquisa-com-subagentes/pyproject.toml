[project]
name = "pesquisa-com-subagentes"
version = "0.1.0"
description = "Exemplo didatico: agente orquestrador que delega a dois subagentes expostos como ferramentas, um de pesquisa na web e um de documentos internos, com contrato de entrada nos argumentos e de saida tipada no response_format"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-ollama>=1.1.0",
    "langchain-postgres>=0.0.19",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
]

[project.scripts]
web = "pesquisa_com_subagentes.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pesquisa_com_subagentes"]
