[project]
name = "chat-devops-memoria"
version = "0.1.0"
description = "Exemplo didatico: memoria de conversa na mao — uma lista de mensagens que cresce a cada turno"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-anthropic>=1.4.8",
    "python-dotenv>=1.2.2",
]

[project.scripts]
chat-devops-memoria = "src.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
