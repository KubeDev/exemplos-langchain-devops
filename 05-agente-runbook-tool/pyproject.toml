[project]
name = "agente-runbook-tool"
version = "0.1.0"
description = "Exemplo didatico: agente consulta runbooks por uma ferramenta com identificador"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-anthropic>=1.4.8",
    "langchain-community>=0.4.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
agente-runbook-tool = "src.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
