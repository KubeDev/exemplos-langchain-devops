[project]
name = "inventario-droplets-mcp"
version = "0.1.0"
description = "Exemplo didatico: agente de inventario DigitalOcean com as ferramentas de um MCP server proprio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain[mcp]>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "pydo>=0.43.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
inventario-droplets-mcp = "src.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
