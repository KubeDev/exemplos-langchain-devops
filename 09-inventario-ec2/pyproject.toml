[project]
name = "inventario-ec2"
version = "0.1.0"
description = "Exemplo didatico: a mesma ferramenta de inventario EC2 declarada de quatro formas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.107",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
inventario-ec2 = "src.app:main"
inspecionar = "src.inspecionar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
