[project]
name = "mcp-retorno-escopo"
version = "0.1.0"
description = "Exemplo didatico: retorno de ferramenta MCP com escopo declarado para um consumidor desconhecido"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.11",
    "langchain-anthropic>=1.7.5",
    "langchain[mcp]>=1.4.3",
    "pydantic>=2.13.5",
    "pydo>=0.43.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
servidor-operacao = "src.servidor:main"
agente-operacao = "src.agente:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
