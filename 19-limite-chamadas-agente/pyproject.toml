[project]
name = "limite-chamadas-agente"
version = "0.1.0"
description = "Exemplo didatico: limite de chamadas de modelo e de ferramenta num agente que acompanha um deploy"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
limite-modelo = "src.limite_modelo:main"
limite-ferramenta = "src.limite_ferramenta:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
