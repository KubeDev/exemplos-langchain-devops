[project]
name = "smart-docker"
version = "0.1.0"
description = "Agente de IA para analise de Dockerfiles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-anthropic>=1.4.8",
    "langchain-community>=0.3.0",
    "python-dotenv>=1.0.0",
    "rich>=14.3.1",
]

[project.scripts]
smart-docker = "src.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
