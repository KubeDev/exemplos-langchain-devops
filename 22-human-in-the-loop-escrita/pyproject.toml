[project]
name = "human-in-the-loop-escrita"
version = "0.1.0"
description = "Exemplo didatico: HumanInTheLoopMiddleware pausando ligar, desligar e reiniciar maquinas para aprovacao humana numa interface web"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
