[project]
name = "central-plataforma-handoff"
version = "0.1.0"
description = "Exemplo didatico: central da plataforma cloud em que a triagem e os especialistas FinOps e Capacidade transferem a conversa entre si por handoff"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
