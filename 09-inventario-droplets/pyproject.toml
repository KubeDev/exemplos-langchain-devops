[project]
name = "inventario-droplets"
version = "0.1.0"
description = "Exemplo didatico: a mesma ferramenta de inventario de Droplets declarada de duas formas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "pydo>=0.43.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
inventario-droplets = "src.app:main"
inspecionar = "src.inspecionar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
