[project]
name = "chat-devops"
version = "0.1.0"
description = "Exemplo didatico: primeiros passos com LangChain — modelo, system prompt e invoke/stream"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-anthropic>=1.4.8",
    "python-dotenv>=1.2.2",
]

[project.scripts]
chat-devops = "src.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
