[project]
name = "assistente-plataforma"
version = "0.1.0"
description = "Exemplo didatico: assistente de plataforma acessa Kubernetes via MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain[mcp]>=1.4.0",
    "langchain-anthropic>=1.4.8",
    "python-dotenv>=1.2.2",
]

[project.scripts]
assistente-plataforma = "src.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
