apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogo-api
  template:
    metadata:
      labels:
        app: catalogo-api
    spec:
      containers:
        - name: catalogo-api
          image: registry.example.com/catalogo-api:latest
          ports:
            - containerPort: 3000
