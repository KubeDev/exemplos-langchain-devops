[project]
name = "pesquisa-web-devops"
version = "0.1.0"
description = "Exemplo didatico: ferramentas prontas de busca e leitura de pagina no agente"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-firecrawl>=0.1.0",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
]

[project.scripts]
pesquisa-web-devops = "src.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
