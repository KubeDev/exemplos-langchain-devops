[project]
name = "inventario-ec2-testes"
version = "0.1.0"
description = "Exemplo didatico: a ferramenta de inventario EC2 testada sem modelo, com pytest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.107",
    "langchain>=1.4.3",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
