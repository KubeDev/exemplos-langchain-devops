[project]
name = "chunking-dados-operacionais"
version = "0.1.0"
description = "Estrategias de chunking para dados operacionais: documentos e logs"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.2",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
runbook = "chunking_dados_operacionais.runbook:main"
log = "chunking_dados_operacionais.log:main"
indexar = "chunking_dados_operacionais.indexar:main"
buscar = "chunking_dados_operacionais.buscar:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"
