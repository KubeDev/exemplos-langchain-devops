services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: aula
      POSTGRES_PASSWORD: aula
      POSTGRES_DB: memoria
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aula -d memoria"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres_data:
