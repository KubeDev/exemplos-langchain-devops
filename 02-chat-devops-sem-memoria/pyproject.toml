[project]
name = "chat-devops-sem-memoria"
version = "0.1.0"
description = "Exemplo didatico: chat continuo sem memoria — o terminal fica aberto, mas cada chamada comeca do zero"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-google-genai>=4.4.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
chat-devops-sem-memoria = "src.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
